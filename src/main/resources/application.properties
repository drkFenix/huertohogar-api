spring.application.name=huertohogar-api
server.port=${SERVER_PORT:8080}

# Conexion MySQL 8 (Docker Compose en puerto 3307 por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/huertohogar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:huerto_user}
spring.datasource.password=${DB_PASSWORD:huerto_dev_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT (HS256, minimo 32 bytes en Base64)
app.jwt.issuer=huertohogar-api
app.jwt.secret-base64=${JWT_SECRET_BASE64:SHVlcnRvSG9nYXJEZXZTZWNyZXRLZXlEU1kxMTA0R3J1cG84MjAyNg==}
app.jwt.access-expiration-seconds=${JWT_ACCESS_EXP_SECONDS:900}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXP_SECONDS:86400}

# Origenes CORS permitidos en desarrollo
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Credenciales de seed inicial para laboratorio
app.seed.enabled=true
app.seed.admin-password=${SEED_ADMIN_PASSWORD:AdminHuerto2026}
app.seed.vendedor-password=${SEED_VENDEDOR_PASSWORD:VendedorHuerto2026}
app.seed.cliente-password=${SEED_CLIENTE_PASSWORD:ClienteHuerto2026}

# Documentacion OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

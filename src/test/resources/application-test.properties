# Perfil de pruebas automatizadas (H2 en memoria compatible con MySQL)
spring.datasource.url=jdbc:h2:mem:huertohogartest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret-base64=VGVzdFNlY3JldEtleUh1ZXJ0b0hvZ2FyRFNZMTEwNEpXVDIwMjY=
app.jwt.access-expiration-seconds=900
app.jwt.refresh-expiration-seconds=86400
app.seed.enabled=true

services:
  mysql:
    image: mysql:8.4
    container_name: huertohogar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: huertohogar
      MYSQL_USER: huerto_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-huerto_dev_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_2026}
    ports:
      - "3307:3306"
    volumes:
      - huertohogar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_2026}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  huertohogar_mysql_data:
